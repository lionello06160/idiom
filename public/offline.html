<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#268bd2" />
    <title>目前無法連線｜成語填填看</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; color: #073642; background: #fdf6e3; }
      main { width: min(100%, 420px); padding: 32px; text-align: center; background: #fffdf5; border: 1px solid #eee8d5; border-radius: 24px; box-shadow: 0 18px 45px rgb(7 54 66 / 10%); }
      .mark { width: 76px; height: 76px; margin: 0 auto 20px; display: grid; place-items: center; color: white; background: #268bd2; border-radius: 22px; font-size: 38px; font-weight: 800; }
      h1 { margin: 0 0 12px; font-size: 26px; }
      p { margin: 0 0 24px; color: #586e75; line-height: 1.7; }
      button { appearance: none; border: 0; border-radius: 999px; padding: 12px 22px; color: white; background: #268bd2; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #b58900; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">成</div>
      <h1>目前無法連線</h1>
      <p>共享棋盤需要網路連線才能取得最新進度。恢復連線後，再重新載入即可繼續。</p>
      <button type="button" onclick="location.reload()">重新載入</button>
    </main>
  </body>
</html>
